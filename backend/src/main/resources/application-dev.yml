# ==============================================================================
# VoxFlow Audio Studio - Development Profile Configuration ('dev')
# Active by default for local development, rapid feedback, and offline prototyping.
# ==============================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tts_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VoxFlowHikariDevPool
      initialization-fail-timeout: -1
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  api:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_RPM:60}
      burst-capacity: ${RATE_LIMIT_BURST:20}
  tts:
    provider: ${TTS_PROVIDER:MOCK}
    api-key: ${TTS_API_KEY:}
    region: ${TTS_REGION:eastus}
    endpoint: ${TTS_ENDPOINT:}
    connect-timeout-ms: ${TTS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${TTS_READ_TIMEOUT_MS:10000}
  ai:
    provider: ${AI_PROVIDER:MOCK}
    api-key: ${AI_API_KEY:}
    endpoint: ${AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:12000}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  demo-auth:
    enabled: ${DEMO_AUTH_ENABLED:true}
    email: ${DEMO_USER_EMAIL:demo@textspeech.local}
    name: ${DEMO_USER_NAME:Demo User}
    password-hash: ${DEMO_USER_PASSWORD_HASH:$2a$10$FycIICn.qpMIrA1F7Oy5v.LoiLJ0aBw8NBrsqvE8kshqLP3ZNk0Qm}

logging:
  level:
    root: INFO
    com.example.tts: DEBUG
