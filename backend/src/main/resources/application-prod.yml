# ==============================================================================
# VoxFlow Audio Studio - Production Profile Configuration ('prod')
# Activated via: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# All database, security, and cloud secrets MUST be supplied through environment variables.
# Zero hardcoded secrets, development fallbacks, or localhost URLs are permitted.
# ==============================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VoxFlowHikariProdPool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_CONNECT_TIMEOUT_MS:30000}
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

app:
  api:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_RPM:30}
      burst-capacity: ${RATE_LIMIT_BURST:10}
  tts:
    provider: ${TTS_PROVIDER:AZURE}
    api-key: ${TTS_API_KEY:}
    region: ${TTS_REGION:eastus}
    endpoint: ${TTS_ENDPOINT:}
    connect-timeout-ms: ${TTS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${TTS_READ_TIMEOUT_MS:10000}
  ai:
    provider: ${AI_PROVIDER:OPENAI}
    api-key: ${AI_API_KEY:}
    endpoint: ${AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:12000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: WARN
    com.example.tts: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n"
